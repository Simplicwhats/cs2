<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Tático CS2 - Web Edition</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <!-- PeerJS para Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- Three.js para Gráficos 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Container do Jogo 3D -->
    <div id="canvas-container"></div>

    <!-- Mira Dinâmica CS2 -->
    <div id="crosshair">
        <div class="ch-line top"></div>
        <div class="ch-line bottom"></div>
        <div class="ch-line left"></div>
        <div class="ch-line right"></div>
        <div class="ch-dot"></div>
    </div>

    <!-- Filtro de Dano / Tela de Morte -->
    <div id="damage-overlay"></div>
    <div id="death-screen" style="display: none;"></div>

    <!-- Placar Superior (Dinâmico) -->
    <div id="scoreboard" style="display: none;">
        <div id="score-wrapper"></div>
    </div>

    <!-- HUD Inferior Esquerdo (HP, Colete e Capacete) -->
    <div id="hud-bottom-left" class="hud-panel" style="display: none;">
        <div class="stat-row">
            <span class="hud-label">HP</span>
            <span id="hp">100</span>
        </div>
        <div class="stat-row">
            <span class="hud-label">MONEY</span>
            <span id="money-display" class="hud-green">$5000</span>
        </div>
        <div class="durability-container">
            <div class="bar-label">COLETE</div>
            <div class="bar-bg"><div id="armor-bar" class="bar-fill"></div></div>
            <div class="bar-label">CAPACETE</div>
            <div class="bar-bg"><div id="helmet-bar" class="bar-fill"></div></div>
        </div>
    </div>

    <!-- HUD Inferior Direito (Munição e Arma) -->
    <div id="hud-bottom-right" class="hud-panel" style="display: none;">
        <div id="weapon-display">Desert Eagle</div>
        <div class="ammo-container">
            <span id="ammo">7</span><span id="reserve-ammo">/ 35</span>
        </div>
    </div>

    <!-- Dica da Loja -->
    <div id="buy-hint" style="display: none;">[B] Loja | [1, 2, 4 / Scroll] Armas/Granada | [W+W] Correr</div>

    <!-- Mensagens de Rodada / Morte -->
    <div id="round-message"></div>
    <div id="kill-feed"></div>

    <!-- Menu de Pausa -->
    <div id="pause-screen" style="display: none;">
        <h1>COMBATE PAUSADO</h1>
        <p>Clique para retornar ao jogo</p>
        <button id="btn-resume">RETORNAR AO JOGO</button>
    </div>

    <!-- Menu de Compra (Loja) -->
    <div id="buy-menu" class="hidden">
        <h2>LOJA TÁTICA DE EQUIPAMENTOS</h2>
        <p>Saldo Disponível: <span id="buy-money-display">$5000</span></p>
        <div class="buy-grid">
            <button id="buy-deagle">Desert Eagle <br><span>$700</span></button>
            <button id="buy-p90">P90 <br><span>$2350</span></button>
            <button id="buy-ak47">AK-47 <br><span>$2700</span></button>
            <button id="buy-m4a4">M4A4 <br><span>$3100</span></button>
            <button id="buy-awp">AWP <br><span>$4750</span></button>
            <button id="buy-armor">Colete Balístico <br><span>$650</span></button>
            <button id="buy-helmet">Capacete <br><span>$350</span></button>
            <button id="buy-grenade">Granada HE <br><span>$300</span></button>
        </div>
        <button id="btn-close-buy">FECHAR LOJA [B]</button>
    </div>

    <!-- Menu Inicial / Lobby CS2 Style -->
    <div id="lobby-container">
        <div class="lobby-box">
            <h1>CS2 WEB TACTICAL</h1>
            
            <div class="input-group">
                <label>NOME DO JOGADOR:</label>
                <input type="text" id="player-nick" value="Striker">
            </div>

            <div class="input-group">
                <label>MAPA DE COMBATE:</label>
                <select id="map-select">
                    <option value="dust2">Dust II (Deserto)</option>
                    <option value="mirage">Mirage (Urbano)</option>
                    <option value="inferno">Inferno (Vilarejo)</option>
                    <option value="nuke">Nuke (Complexo)</option>
                </select>
            </div>

            <div class="mode-select">
                <button class="mode-btn active" id="mode-bot">Treino (Bots)</button>
                <button class="mode-btn" id="mode-1v1">1v1 Online</button>
                <button class="mode-btn" id="mode-2v2">3 Players Online</button>
            </div>

            <div id="net-link-section" style="display: none;">
                <label>Link da Sala:</label>
                <input type="text" id="lobby-link" readonly>
                <p id="net-status-label">Aguardando conexão...</p>
            </div>

            <button id="btn-start" class="primary-btn">ENTRAR NA PARTIDA</button>
        </div>
    </div>

    <!-- Script Principal como Módulo ES6 -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
