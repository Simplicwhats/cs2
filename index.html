<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Web Clone</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">

    <!-- PeerJS para Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- Import Map com THREE.js e Loaders -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="lobby-container">
        <h1>CS2 WEB EDITION</h1>
        <div class="lobby-card">
            <label>NICKNAME:</label> <input type="text" id="player-nick" value="Striker" maxlength="15">
            <label>MODO DE JOGO:</label>
            <div class="mode-selector">
                <button id="mode-bot" class="mode-btn active">VS BOTS</button>
                <button id="mode-online" class="mode-btn">MULTIPLAYER</button>
            </div>
            <div id="net-link-section" style="display: none;">
                <label>SALA ONLINE (Digite a mesma que seu amigo):</label>
                <input type="text" id="room-id" value="dust2-server" maxlength="15">
            </div>
            <button id="btn-start" class="btn-primary">ENTRAR NO SERVIDOR</button>
        </div>
    </div>

    <div id="canvas-container"></div>
    <div id="crosshair" class="crosshair-standard"></div>
    <div id="scope-overlay"></div>
    <div id="damage-overlay"></div>
    <div id="kill-feed"></div>
    
    <div id="scoreboard"><div id="score-wrapper"></div></div>
    <div id="buy-hint">[ B ] - LOJA DE ARMAS</div>
    <div id="round-message"></div>

    <div id="hud-bottom-left">
        <div class="hud-bar-container"><span class="hud-label">HP</span><span id="hp">100</span></div>
        <div class="hud-status">
            <div class="status-bar-bg"><div id="armor-bar" style="width: 0%;"></div></div>
            <div class="status-bar-bg"><div id="helmet-bar" style="width: 0%;"></div></div>
        </div>
    </div>

    <div id="hud-bottom-right">
        <div id="money-display">$5000</div>
        <div id="weapon-display">Desert Eagle</div>
        <div class="ammo-wrapper"><span id="ammo">7</span><span id="reserve-ammo">/ 35</span></div>
    </div>

    <div id="death-screen"><h2>VOCÊ MORREU</h2><p>Aguarde...</p></div>
    <div id="pause-screen"><h1>JOGO PAUSADO</h1><button id="btn-resume" class="btn-primary">CONTINUAR</button></div>

    <div id="buy-menu" class="hidden">
        <div class="buy-header"><h2>LOJA TÁTICA</h2><div id="buy-money-display">$5000</div></div>
        <div class="buy-grid">
            <div class="buy-column">
                <h3>EQUIP</h3>
                <button id="buy-armor">COLETE ($650)</button>
                <button id="buy-helmet">CAPACETE ($350)</button>
                <button id="buy-grenade">GRANADA ($300)</button>
            </div>
            <div class="buy-column"><h3>PISTOLAS</h3><button id="buy-deagle">DEAGLE ($700)</button></div>
            <div class="buy-column">
                <h3>RIFLES</h3>
                <button id="buy-p90">P90 ($2350)</button>
                <button id="buy-ak47">AK-47 ($2700)</button>
                <button id="buy-m4a4">M4A4 ($3100)</button>
                <button id="buy-awp">AWP ($4750)</button>
            </div>
        </div>
        <button id="btn-close-buy" class="btn-secondary">FECHAR [ B ]</button>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
